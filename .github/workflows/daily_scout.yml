name: Daily Job Scout

on:
  schedule:
    - cron: '30 6 * * 2-6' # 07:30 CET, tisdag-lördag (fångar mån-fre)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scout:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install requests pydantic google-genai python-jobspy pandas

      - name: Run Job Sourcing Agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_WEBHOOK_URL_ANTHON: ${{ secrets.DISCORD_WEBHOOK_URL_ANTHON }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          SERPAPI_KEY_2: ${{ secrets.SERPAPI_KEY_2 }}
          EVENT_NAME: ${{ github.event_name }}
        run: python main.py

      - name: Save seen jobs database
        run: |
          git config user.name "Job Scout Bot"
          git config user.email "bot@users.noreply.github.com"
          git add seen_jobs.db
          git diff --staged --quiet || git commit -m "chore: update seen_jobs.db"
          git push
