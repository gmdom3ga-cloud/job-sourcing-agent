name: Daily Job Scout

on:
  schedule:
    # Runs at 06:30 UTC (07:30 CET) Tuesday through Saturday (skips Sunday & Monday mornings)
    - cron: '30 6 * * 2-6'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scout:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pydantic google-genai python-jobspy

      - name: Run Job Sourcing Agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          EVENT_NAME: ${{ github.event_name }}
        run: python main.py

      - name: Save seen jobs database
        run: |
          git config user.name "Job Scout Bot"
          git config user.email "actions@github.com"
          git add seen_jobs.db
          git diff --staged --quiet || git commit -m "chore: update seen_jobs.db"
          git push
